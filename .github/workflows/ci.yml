name: CI

on:
  merge_group:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

permissions:
  contents: read

env:
  CI: true
  HUSKY: 0
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            command: pnpm lint
            cache-scope: lint
          - name: Type check
            command: pnpm check-types
            cache-scope: typecheck
          - name: Unit tests
            command: pnpm test
            cache-scope: test
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache-scope: ${{ matrix.cache-scope }}

      - name: ${{ matrix.name }}
        run: ${{ matrix.command }}

      - name: Upload Turbo diagnostics
        if: failure() && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-${{ matrix.cache-scope }}-${{ github.run_id }}
          path: .turbo/runs/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      API_URL: http://localhost:4000
      NEXT_PUBLIC_API_URL: http://localhost:4000
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache-scope: build

      - name: Build workspace
        run: pnpm build

      - name: Upload OpenAPI contract
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-${{ github.sha }}
          path: apps/api/openapi.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload Turbo diagnostics
        if: failure() && !env.ACT
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: turbo-build-${{ github.run_id }}
          path: .turbo/runs/
          if-no-files-found: ignore
          retention-days: 7

  migrations:
    name: Database migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine@sha256:57c72fd2a128e416c7fcc499958864df5301e940bca0a56f58fddf30ffc07777
        env:
          POSTGRES_DB: ci_pipeline
          POSTGRES_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          POSTGRES_USER: ci_pipeline
        ports:
          - 5432/tcp
        options: >-
          --health-cmd="pg_isready -U ci_pipeline -d ci_pipeline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Node.js and pnpm
        uses: ./.github/actions/setup-node-pnpm
        with:
          turbo-cache-scope: migrations

      - name: Configure ephemeral database connection
        env:
          CI_DB_NAME: ci_pipeline
          CI_DB_PASSWORD: ci-${{ github.run_id }}-${{ github.run_attempt }}
          CI_DB_PORT: ${{ job.services.postgres.ports['5432'] || '55432' }}
          CI_DB_USER: ci_pipeline
        run: |
          echo "::add-mask::$CI_DB_PASSWORD"
          echo "DATABASE_URL=postgresql://${CI_DB_USER}:${CI_DB_PASSWORD}@127.0.0.1:${CI_DB_PORT}/${CI_DB_NAME}" >> "$GITHUB_ENV"

      - name: Apply migrations
        run: pnpm db:deploy

      - name: Verify migrations are idempotent
        run: pnpm db:deploy

  docker:
    name: Docker build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        if: ${{ !env.ACT }}
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build production images
        if: ${{ !env.ACT }}
        uses: docker/bake-action@82490499d2e5613fcead7e128237ef0b0ea210f7 # v7.0.0
        with:
          files: docker-bake.ci.hcl
          targets: validate

      - name: Build production images locally
        if: ${{ env.ACT }}
        run: docker buildx bake -f docker-bake.ci.hcl validate --set '*.cache-from=' --set '*.cache-to='

  ci-success:
    name: CI success
    if: always()
    needs: [quality, build, migrations, docker]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          if [[ "$RESULTS" == *failure* || "$RESULTS" == *cancelled* ]]; then
            echo "One or more required jobs did not succeed: $RESULTS"
            exit 1
          fi

  release-gate:
    name: Validate release tag
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: ci-success
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require a semantic version tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          SEMVER='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$'
          if [[ ! "$RELEASE_TAG" =~ $SEMVER ]]; then
            echo "Release tag must be valid SemVer prefixed with v; received: $RELEASE_TAG"
            exit 1
          fi

  publish:
    name: Publish ${{ matrix.target }} image
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: release-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        target: [api, web, migrate]
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@b45d80f862d83dbcd57f89517bcf500b2ab88fb2 # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@030e881283bb7a6894de51c315a6bfe6a94e05cf # v6.0.0
        with:
          images: ghcr.io/${{ github.repository }}-${{ matrix.target }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}

      - name: Build and publish image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          file: Dockerfile
          target: ${{ matrix.target }}
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha,scope=docker-${{ matrix.target }}
          cache-to: type=gha,mode=max,scope=docker-${{ matrix.target }}
          provenance: mode=max
          sbom: true
